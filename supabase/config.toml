project_id = "scriptrunner-local"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true
ip_version = "IPv4"
heartbeat_interval_ms = 5000
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# OTP expiry for magic links, email confirmation, etc.
email_otp_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # disable for local dev

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

[functions.create-invitation]
verify_jwt = true

[functions.redeem-invitation]
verify_jwt = false

[functions.device-auth]
verify_jwt = false

# Zero-touch enrollment: authenticated by the organization enrollment key,
# not by a Supabase JWT.
[functions.enroll-device]
verify_jwt = false

# Agent transport: authenticated by the device JWT verified inside the function.
[functions.agent-gateway]
verify_jwt = false

[functions.submit-job]
verify_jwt = true

[functions.cancel-job]
verify_jwt = true

[functions.revoke-device]
verify_jwt = true

[functions.expire-jobs]
verify_jwt = false
